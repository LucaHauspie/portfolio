<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About | Luca Hauspie</title>
  <meta name="description" content="About Luca Hauspie, digital designer and creative developer from Belgium.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.css">
  <link rel="stylesheet" href="css/style.css">
  <script>setTimeout(function(){if(!window.__siteBooted){var t=document.querySelector('.transition');t&&t.remove();}},5000);</script>
</head>
<body data-page="about" class="about">

  <!-- page transition overlay: in the HTML so it covers the page from the very first paint (no white flash) -->
  <div class="transition" aria-hidden="true"><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__label display"></div></div>
  <script>try{var l=sessionStorage.getItem('lh-label');if(l){var e=document.querySelector('.transition__label');e.textContent=l;e.style.opacity=1;}}catch(_){}</script>

  <main>
    <section class="page-hero about-hero" data-header="dark">
      <div class="about-hero__portrait" data-reveal="clip">
        <img src="assets/about/portrait.jpg" alt="Portrait of Luca Hauspie" data-parallax>
      </div>
      <h1 class="display page-hero__title about-hero__title" data-fit="1" data-fit-vh="0.62" data-reveal="chars">
        <span class="line"><span class="line__in" data-split>About</span></span>
        <span class="line"><span class="line__in" data-split>(Me)</span></span>
      </h1>
      <div class="page-hero__row mono" data-reveal="stagger">
        <!-- facts come from content/about.md (## Hero) -->
        <span class="about-facts" data-facts></span>
        <span>(Status)<br><span data-availability></span></span>
      </div>
    </section>

    <!-- intro + chapters are rendered from content/about.md by js/about.js -->
    <section class="about-intro" data-header="dark">
      <p class="mono">(Intro)</p>
      <p class="about-intro__text" data-reveal="fade"></p>
    </section>

    <div data-chapters></div>
  </main>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/about.js" defer></script>
</body>
</html>
