<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In progress | Luca Hauspie</title>
  <meta name="description" content="What Luca Hauspie is working on right now: first steps into 3D in Blender and WebGPU / Three.js.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.css">
  <link rel="stylesheet" href="css/style.css">
  <script>setTimeout(function(){if(!window.__siteBooted){var t=document.querySelector('.transition');t&&t.remove();}},5000);</script>
</head>
<body data-page="wip" class="wip">

  <!-- page transition overlay: in the HTML so it covers the page from the very first paint (no white flash) -->
  <div class="transition" aria-hidden="true"><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__label display"></div></div>
  <script>try{var l=sessionStorage.getItem('lh-label');if(l){var e=document.querySelector('.transition__label');e.textContent=l;e.style.opacity=1;}}catch(_){}</script>

  <!-- projects come from js/data.js (window.WIP), texts from content/wip.md -->
  <main>
    <section class="wip-hero" data-header="dark">
      <p class="mono wip-hero__label" data-t="wipLabel"></p>
      <h1 class="display wip-hero__title" data-fit="1" data-fit-vh="0.42" data-reveal="chars">
        <span class="line"><span class="line__in" data-split data-t="wipTitle"></span></span>
      </h1>
      <p class="wip-hero__intro" data-reveal="fade"></p>
    </section>

    <section class="wip-list" data-header="dark"></section>
  </main>

  <div data-footer="mini"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/beat.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/wip.js" defer></script>
</body>
</html>
