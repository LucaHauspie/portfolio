<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca Hauspie | Selected works</title>
  <meta name="description" content="Portfolio of Luca Hauspie, digital designer and creative developer from Belgium. Motion, web, branding and interactive media.">
  <meta property="og:title" content="Luca Hauspie | Selected works">
  <meta property="og:description" content="Digital designer and creative developer from Belgium. Motion, web, branding and interactive media.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js for the pile of TVs (loaded as a module by js/home.js) -->
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
  <script>setTimeout(function(){if(!window.__siteBooted){var t=document.querySelector('.transition');t&&t.remove();}},5000);</script>
</head>
<body data-page="home">

  <!-- page transition overlay: in the HTML so it covers the page from the very first paint (no white flash) -->
  <div class="transition" aria-hidden="true"><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__col"></div><div class="transition__label display"></div></div>
  <script>try{var l=sessionStorage.getItem('lh-label');if(l){var e=document.querySelector('.transition__label');e.textContent=l;e.style.opacity=1;}}catch(_){}</script>

  <main>
    <!-- HERO: a pile of old TVs (js/pile.js). Hover a TV: a bigger screen pops up next to it with the preview -->
    <section class="hero hero--pile" data-header="light">
      <canvas class="pile" aria-hidden="true"></canvas>
      <h1 class="sr-only">Luca Hauspie, digital designer and creative developer</h1>
      <div class="hero__meta mono" data-reveal="stagger">
        <!-- texts come from window.TEXT in js/data.js -->
        <p data-t="heroLeft"></p>
        <p data-t="heroRight"></p>
      </div>
      <svg class="pile-line" aria-hidden="true"><line></line><circle r="3"></circle></svg>
      <div class="pile-pop" aria-hidden="true">
        <div class="pile-pop__screen"></div>
        <div class="pile-pop__caption">
          <span class="pile-pop__num mono"></span>
          <span class="pile-pop__text"><span class="pile-pop__title"></span><span class="pile-pop__sub"></span></span>
          <span class="pile-pop__meta mono"></span>
        </div>
      </div>
      <div class="pile-tags mono" aria-hidden="true"></div>
      <nav class="pile-list mono" aria-label="Projects"></nav>
    </section>

    <!-- MARQUEE -->
    <section class="marquee" data-header="dark" aria-hidden="true">
      <div class="marquee__track"></div>
    </section>

    <!-- WORKS — list / grid toggle -->
    <section class="works" id="works" data-header="light">
      <div class="works__head">
        <h2 class="display works__title">
          <span class="line"><span class="line__in" data-split data-t="worksTitle"></span></span>
        </h2>
        <div class="works__side mono">
          <span data-t="worksSide"></span>
          <div class="toggle" role="group" aria-label="Layout">
            <span class="toggle__pill"></span>
            <button type="button" data-mode="list" aria-pressed="true">List</button>
            <button type="button" data-mode="grid" aria-pressed="false">Grid</button>
          </div>
        </div>
      </div>
      <div class="works__list"></div>
    </section>

    <!-- LIVE VISUALS: the passion project in January (texts in js/data.js) -->
    <section class="live" data-header="dark">
      <p class="live__label mono" data-t="liveLabel"></p>
      <h2 class="display live__title" data-fit="1">
        <span class="line"><span class="line__in" data-split data-t="liveTitle"></span></span>
      </h2>
      <div class="live__row">
        <p class="live__text" data-t="liveText" data-reveal="fade"></p>
        <p class="mono" data-t="liveFacts"></p>
        <p class="mono" data-t="liveTools"></p>
      </div>
      <a class="pill mono live__cta" href="wip.html" data-magnetic><span data-t="liveButton"></span> <span>→</span></a>
    </section>

    <!-- STATEMENT -->
    <section class="statement" data-header="light">
      <p class="statement__label mono" data-t="statementLabel"></p>
      <p class="statement__text" data-t="statement"></p>
      <a class="pill mono statement__cta" href="about.html" data-magnetic><span data-t="statementButton"></span> <span>→</span></a>
    </section>
  </main>

  <div class="work-preview screen" aria-hidden="true"><div class="work-preview__inner"></div></div>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/home.js" defer></script>
</body>
</html>
